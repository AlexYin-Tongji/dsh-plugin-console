name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run release:verify
      - name: Verify tag matches package version
        run: node -e "const p=require('./package.json'); if ('v'+p.version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - name: Check whether npm version already exists
        id: npm-version
        run: |
          node <<'NODE'
          const { appendFileSync } = require('node:fs')
          const { spawnSync } = require('node:child_process')
          const packageJson = require('./package.json')
          const spec = `${packageJson.name}@${packageJson.version}`
          const result = spawnSync('npm', ['view', spec, 'version', '--json'], { encoding: 'utf8' })
          const output = `${result.stdout ?? ''}\n${result.stderr ?? ''}`
          if (result.status === 0) {
            console.log(`${spec} is already published; skipping npm publish.`)
            appendFileSync(process.env.GITHUB_OUTPUT, 'exists=true\n')
            process.exit(0)
          }
          if (!/\bE404\b|\b404\s+Not Found\b/i.test(output)) {
            process.stderr.write(output)
            process.exit(result.status ?? 1)
          }
          console.log(`${spec} is not published; npm publish will run.`)
          appendFileSync(process.env.GITHUB_OUTPUT, 'exists=false\n')
          NODE
      - name: Publish npm package
        if: steps.npm-version.outputs.exists != 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
